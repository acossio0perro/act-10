<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Conversor de temperaturas</title>
</head>
<body>

    <h1>Conversor de temperaturas</h1>

    <label for="inputTemp">Ingresa la temperatura:</label>
    <input type="number" id="inputTemp">

    <br><br>

    <label for="selectTipo">Tipo de conversión:</label>
    <select id="selectTipo">
        <option value="cf">Celsius a Fahrenheit</option>
        <option value="fc">Fahrenheit a Celsius</option>
    </select>

    <br><br>

    <button id="btnConvertir">Convertir</button>

    <h2>Resultado:</h2>
    <p id="resultado">Aquí aparecerá el resultado...</p>

    <!-- Enlazamos el archivo JavaScript -->
    <script src="temperaturas.js"></script>
</body>
</html>
